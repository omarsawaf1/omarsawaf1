name: Update GitHub Stats

on:
  schedule:
    # Runs automatically at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Generate GitHub Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=omarsawaf1&show_icons=true&theme=dracula&hide_border=false&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=omarsawaf1&layout=compact&langs_count=6&theme=dracula&hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats Card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          user: omarsawaf1
          theme: dracula
          hide_border: "false"
          output: profile/streak.svg

      - name: Commit and Push Updated Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
